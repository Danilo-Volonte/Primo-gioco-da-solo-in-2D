<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background: erba -->
  <rect x="0" y="0" width="1600" height="1000" fill="#4a8c3f"/>

  <!-- Texture leggera del prato -->
  <g opacity="0.08">
    <rect x="0" y="0" width="1600" height="1000" fill="url(#grassPattern)"/>
  </g>
  <defs>
    <pattern id="grassPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#4a8c3f"/>
      <circle cx="10" cy="10" r="2" fill="#3f7a35"/>
      <circle cx="30" cy="25" r="2" fill="#3f7a35"/>
    </pattern>
  </defs>

  <!-- Bordo esterno pista (cordoli) -->
  <path d="M 300 150
           L 1100 150
           Q 1300 150 1300 350
           L 1300 550
           Q 1300 750 1100 750
           L 700 750
           Q 550 750 550 650
           L 550 600
           Q 550 550 500 550
           L 350 550
           Q 200 550 200 400
           L 200 300
           Q 200 150 300 150
           Z"
        fill="none" stroke="#e8e8e8" stroke-width="184" stroke-linejoin="round"/>

  <!-- Asfalto pista -->
  <path d="M 300 150
           L 1100 150
           Q 1300 150 1300 350
           L 1300 550
           Q 1300 750 1100 750
           L 700 750
           Q 550 750 550 650
           L 550 600
           Q 550 550 500 550
           L 350 550
           Q 200 550 200 400
           L 200 300
           Q 200 150 300 150
           Z"
        fill="none" stroke="#3a3a3f" stroke-width="160" stroke-linejoin="round"/>

  <!-- Linea centrale tratteggiata -->
  <path d="M 300 150
           L 1100 150
           Q 1300 150 1300 350
           L 1300 550
           Q 1300 750 1100 750
           L 700 750
           Q 550 750 550 650
           L 550 600
           Q 550 550 500 550
           L 350 550
           Q 200 550 200 400
           L 200 300
           Q 200 150 300 150
           Z"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="20,20" opacity="0.6"/>

  <!-- Cordoli rosso/bianco su alcune curve -->
  <path d="M 1210 190 Q 1290 220 1290 350" fill="none" stroke="#cc2222" stroke-width="14" stroke-dasharray="18,18"/>
  <path d="M 250 200 Q 220 250 220 320" fill="none" stroke="#cc2222" stroke-width="14" stroke-dasharray="18,18"/>

  <!-- Linea di partenza/arrivo -->
  <g>
    <rect x="690" y="70" width="20" height="80" fill="#ffffff"/>
    <rect x="690" y="70" width="20" height="10" fill="#000000"/>
    <rect x="690" y="90" width="20" height="10" fill="#000000"/>
    <rect x="690" y="110" width="20" height="10" fill="#000000"/>
    <rect x="690" y="130" width="20" height="10" fill="#000000"/>
  </g>
  <text x="700" y="55" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">START / FINISH</text>

  <!-- Griglia di partenza (indicatori posizione) -->
  <g fill="#ffdd33" opacity="0.9">
    <circle cx="650" cy="180" r="6"/>
    <circle cx="750" cy="180" r="6"/>
    <circle cx="650" cy="210" r="6"/>
    <circle cx="750" cy="210" r="6"/>
  </g>

  <!-- Punti cardinali / riferimenti per debug -->
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" opacity="0.7">Test Track — no obstacles</text>

</svg>
